name: Obedové menu do Slacku
 
on:
  schedule:
    # 1:47 UTC = cca 3:47 (letný čas) / 2:47 (zimný čas) SEČ/SELČ.
    # Zámerne skoro ráno a na "nekrúhlu" minútu, nie presne na celú
    # hodinu – GitHub Actions naplánované behy negarantuje na presný
    # čas a práve behy na celú hodinu (napr. "0 3 * * *") sa pri
    # vyššom zaťažení oneskorujú najviac. Táto rezerva (cca 6–8 hodín
    # do 10:30) má vystačiť aj keby sa beh oneskoril podobne ako dnes.
    - cron: '47 1 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Testovací beh bez odoslania do Slacku (výsledok len v logu tohto behu).
        required: false
        type: boolean
        default: false
 
jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4
 
      - name: Inštalácia Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Inštalácia závislostí
        run: pip install -r requirements.txt
 
      - name: Spustenie scrapera
        run: python menu_scraper.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CALORIENINJAS_API_KEY: ${{ secrets.CALORIENINJAS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
 
